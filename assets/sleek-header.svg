<text class="meta" x="400" y="204" text-anchor="middle">FRONTEND DEVELOPER · EGYPT</text>
<text x="400" y="255" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#686875">DESIGN  /  BUILD  /  IMPROVE</text>
</svg>