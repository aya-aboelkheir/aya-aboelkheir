<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<style>
  .name{font-family:Inter,system-ui,sans-serif;font-size:56px;font-weight:700;letter-spacing:-1.5px;fill:#f7f7fb;opacity:0;animation:fade 8s ease-in-out infinite}
  .meta{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:2px;fill:#a5a5b3;opacity:0;animation:fade 8s ease-in-out .35s infinite}
  .line{transform-origin:center;animation:draw 8s ease-in-out infinite}
  .corner{fill:#dc2626;opacity:.65}
  @keyframes fade{0%,5%{opacity:0;transform:translateY(8px)}16%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes draw{0%,18%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(1)}}
</style>
<rect width="800" height="300" rx="14" fill="#0d0d10"/>
