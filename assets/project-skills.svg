<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
<style>
  text{font-family:Inter,system-ui,sans-serif}
  .label{font-size:15px;font-weight:600;fill:#f7f7fb}
  .value{font-family:ui-monospace,monospace;font-size:12px;fill:#a5a5b3}
  .track{fill:#292930}
  .fill{fill:#dc2626;transform-box:fill-box;transform-origin:left center;animation:grow 2s cubic-bezier(.2,.7,.2,1) both}
  .row{opacity:0;animation:appear .7s ease-out forwards}
  .r1{animation-delay:.15s}.r2{animation-delay:.25s}.r3{animation-delay:.35s}.r4{animation-delay:.45s}.r5{animation-delay:.55s}.r6{animation-delay:.65s}.r7{animation-delay:.75s}.r8{animation-delay:.85s}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes appear{to{opacity:1}}
</style>
<rect width="800" height="470" rx="14" fill="#0d0d10"/>
<path d="M48 50h28v3H48z" fill="#dc2626"/>
